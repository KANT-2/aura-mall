name: AURA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  web-check:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check:web

      - name: Build frontend
        run: npm run build

  api-check:
    name: Backend checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --directory apps/api --locked

      - name: Check backend
        run: |
          uv run --directory apps/api --locked ruff check .
          uv run --directory apps/api --locked ruff format --check .
          uv run --directory apps/api --locked pytest

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build FastAPI image
        run: docker build -t aura-api:ci ./apps/api

      - name: Build Next.js image
        run: docker build -f apps/web/Dockerfile -t aura-web:ci .

  database-operations:
    name: Database TLS, rotation and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Check operations scripts
        run: |
          uv sync --directory apps/api --locked
          apps/api/.venv/bin/ruff check ops
          apps/api/.venv/bin/ruff format --check ops
          for script in ops/postgres/*.sh; do sh -n "$script"; done

      - name: Exercise disposable database cluster
        run: python3 ops/test_database.py
