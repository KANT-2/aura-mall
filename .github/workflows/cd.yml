name: AURA CD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify deployment SSH access
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Confirm deployment branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" != "develop" ]; then
            echo "Only develop can deploy"
            exit 1
          fi

      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Connect to Debian server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_HOST_PUBLIC_KEY: ${{ secrets.DEPLOY_HOST_PUBLIC_KEY }}
        run: |
          printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_HOST_PUBLIC_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "hostname && test -d '$DEPLOY_PATH' && echo 'SSH connection OK'"

      - name: Deploy AURA to Debian
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -se -- "$DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail

          cd "$1"

          echo "Checking deployment directory..."
          test -f compose.yaml
          test -f .env

          echo "Checking Git working tree..."
          test -z "$(git status --porcelain --untracked-files=no)"

          echo "Updating develop..."
          git fetch origin develop
          git switch develop
          git pull --ff-only origin develop

          echo "Validating Compose configuration..."
          test -f compose.web2.yaml
          docker network inspect caddy > /dev/null

          compose_args=(-f compose.yaml)
          if test -f .db-ops/client/database-url; then
            compose_args+=(-f compose.database.yaml)
          fi
          compose_args+=(-f compose.web2.yaml)
          docker compose "${compose_args[@]}" config --quiet

          echo "Checking AURA database..."
          if test -f .db-ops/client/database-url; then
            python3 ops/database.py status
          else
            docker compose "${compose_args[@]}" up -d --no-deps db
            docker compose "${compose_args[@]}" exec -T db \
              sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
          fi

          echo "Building API and Next.js..."
          docker compose "${compose_args[@]}" build api web

          echo "Backing up AURA database..."
          if test -f .db-ops/client/database-url; then
            python3 ops/database.py backup
          else
            mkdir -p "$HOME/workspace/aura-backups"
            chmod 700 "$HOME/workspace/aura-backups"
            backup="$HOME/workspace/aura-backups/aura-$(date +%Y%m%d-%H%M%S).dump"
            docker compose "${compose_args[@]}" exec -T db \
              sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$backup"
            docker compose "${compose_args[@]}" exec -T db \
              pg_restore -l < "$backup" > /dev/null
          fi

          echo "Applying Alembic migrations..."
          docker compose "${compose_args[@]}" run --rm --no-deps api alembic upgrade head

          echo "Deploying two FastAPI and two Next.js containers..."
          if test -f .db-ops/client/database-url; then
            python3 ops/database.py deploy-api
          fi
          docker compose "${compose_args[@]}" up -d --no-deps api web web2

          echo "Checking both API containers..."
          healthy=false
          for attempt in $(seq 1 12); do
            mapfile -t api_containers < <(
              docker compose "${compose_args[@]}" ps --status running -q api
            )
            if [ "${#api_containers[@]}" -eq 2 ]; then
              healthy=true
              for container in "${api_containers[@]}"; do
                if ! docker exec "$container" python -c \
                  "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"; then
                  healthy=false
                  break
                fi
              done
              if [ "$healthy" = "true" ]; then
                break
              fi
            fi
            echo "API containers not ready yet (attempt $attempt/12)"
            sleep 5
          done

          if [ "$healthy" != "true" ]; then
            echo "API health check failed"
            exit 1
          fi

          echo "Checking both Next.js containers..."
          web_healthy=false
          for attempt in $(seq 1 12); do
            if docker compose "${compose_args[@]}" exec -T web node -e \
                 "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" \
              && docker compose "${compose_args[@]}" exec -T web2 node -e \
                 "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              web_healthy=true
              break
            fi
            echo "Next.js containers not ready yet (attempt $attempt/12)"
            sleep 5
          done

          if [ "$web_healthy" != "true" ]; then
            echo "Next.js health check failed"
            exit 1
          fi

          echo "Checking public HTTPS route..."
          public_healthy=false
          for attempt in $(seq 1 12); do
            if curl -fsS -o /dev/null https://aura.dev.crasnec.com; then
              public_healthy=true
              break
            fi
            echo "Public route not ready yet (attempt $attempt/12)"
            sleep 5
          done

          if [ "$public_healthy" != "true" ]; then
            echo "Public HTTPS health check failed"
            exit 1
          fi

          echo "AURA HA deployment completed"

          REMOTE
