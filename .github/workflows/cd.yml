name: AURA CD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify deployment SSH access
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Confirm deployment branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" != "develop" ]; then
            echo "Only develop can deploy"
            exit 1
          fi

      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Connect to Debian server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_HOST_PUBLIC_KEY: ${{ secrets.DEPLOY_HOST_PUBLIC_KEY }}
        run: |
          printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_HOST_PUBLIC_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "hostname && test -d '$DEPLOY_PATH' && echo 'SSH connection OK'"

      - name: Deploy AURA to Debian
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -se -- "$DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail

          cd "$1"

          echo "Checking deployment directory..."
          test -f compose.yaml
          test -f .env

          echo "Checking Git working tree..."
          test -z "$(git status --porcelain --untracked-files=no)"

          echo "Updating develop..."
          git fetch origin develop
          git switch develop
          git pull --ff-only origin develop

          echo "Validating Compose configuration..."
          compose_args=(-f compose.yaml)
          if test -f .db-ops/client/database-url; then
            compose_args+=(-f compose.database.yaml)
          fi
          docker compose "${compose_args[@]}" config --quiet

          echo "Building and deploying AURA API..."
          if test -f .db-ops/client/database-url; then
            python3 ops/database.py deploy-api
          else
            docker compose "${compose_args[@]}" up -d --build --no-deps api
          fi

          echo "Checking AURA API..."
          docker compose "${compose_args[@]}" ps api

          echo "Waiting for AURA API health check..."

          healthy=false
          for attempt in $(seq 1 12); do
            if docker compose "${compose_args[@]}" exec -T api python -c \
              "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read().decode())"; then
              healthy=true
              break
            fi

            echo "API not ready yet (attempt $attempt/12)"
            sleep 5
          done

          if [ "$healthy" != "true" ]; then
            echo "AURA API health check failed"
            exit 1
          fi

          echo "AURA API deployment completed"

          REMOTE
