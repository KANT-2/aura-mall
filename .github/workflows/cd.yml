name: AURA CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy AURA
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Confirm deployment branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" != "main" ] && [ "$BRANCH" != "develop" ]; then
            echo "Only main or develop can deploy"
            exit 1
          fi

      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Connect to Debian server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_HOST_PUBLIC_KEY: ${{ secrets.DEPLOY_HOST_PUBLIC_KEY }}
        run: |
          printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_HOST_PUBLIC_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "hostname && test -d '$DEPLOY_PATH' && echo 'SSH connection OK'"

      - name: Stage test payment settings
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          AURA_TOSS_SECRET_KEY: ${{ secrets.AURA_TOSS_SECRET_KEY }}
          NEXT_PUBLIC_TOSS_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_TOSS_CLIENT_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          secret = os.environ.get('AURA_TOSS_SECRET_KEY', '')
          client = os.environ.get('NEXT_PUBLIC_TOSS_CLIENT_KEY', '')
          if not secret and not client:
              raise SystemExit(0)
          if not re.fullmatch(r'test_g?sk_[A-Za-z0-9_-]{8,200}', secret) or not re.fullmatch(r'test_g?ck_[A-Za-z0-9_-]{8,200}', client):
              raise SystemExit('Configure both valid Toss test keys in the deployment environment')
          os.umask(0o077)
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'aura-payments.json'
          target.write_text(json.dumps({'AURA_TOSS_SECRET_KEY': secret, 'NEXT_PUBLIC_TOSS_CLIENT_KEY': client}))
          PY
          if test -f "$RUNNER_TEMP/aura-payments.json"; then
            scp -q -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$RUNNER_TEMP/aura-payments.json" \
              "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env.payments-pending.json"
          fi

      - name: Deploy AURA to Debian
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -se -- "$DEPLOY_PATH" "$DEPLOY_BRANCH" "$DEPLOY_COMMIT" <<'REMOTE'
          set -euo pipefail

          deploy() {
            cd "$1"
            deploy_branch="$2"
            deploy_commit="$3"
            case "$deploy_branch" in
              main|develop) ;;
              *) echo "Unsupported deployment branch"; exit 1 ;;
            esac

            echo "Checking deployment directory..."
            test -f compose.yaml
            test -f .env

            echo "Checking Git working tree..."
            test -z "$(git status --porcelain --untracked-files=no)"

            echo "Updating $deploy_branch..."
            git fetch origin "$deploy_branch"
            git switch "$deploy_branch"
            git pull --ff-only origin "$deploy_branch"
            test "$(git rev-parse HEAD)" = "$deploy_commit"

            if test -f .env.payments-pending.json; then
              python3 ops/configure_payments.py < .env.payments-pending.json
              rm -- .env.payments-pending.json
            fi

            echo "Validating Compose configuration..."

            compose_args=(-f compose.yaml)
            if test -f .db-ops/client/database-url; then
              compose_args+=(-f compose.database.yaml)
            fi
            if test -f compose.lb.yaml; then
              compose_args+=(-f compose.lb.yaml)
            fi
            docker compose "${compose_args[@]}" config --quiet
            caddy_network=$(docker compose "${compose_args[@]}" config --format json |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["networks"]["caddy"]["name"])')
            docker network inspect "$caddy_network" > /dev/null
            api_replicas=$(docker compose "${compose_args[@]}" config --format json |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["api"]["deploy"]["replicas"])')
            web_replicas=$(docker compose "${compose_args[@]}" config --format json |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["web"]["deploy"]["replicas"])')

            echo "Checking AURA database..."
            if test -f .db-ops/client/database-url; then
              python3 ops/database.py status
            else
              docker compose "${compose_args[@]}" up -d --no-deps db
              docker compose "${compose_args[@]}" exec -T db \
                sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            fi

            echo "Building API and Next.js..."
            docker compose "${compose_args[@]}" build api web

            echo "Backing up AURA database..."
            if test -f .db-ops/client/database-url; then
              python3 ops/database.py backup
            else
              mkdir -p "$HOME/workspace/aura-backups"
              chmod 700 "$HOME/workspace/aura-backups"
              backup="$HOME/workspace/aura-backups/aura-$(date +%Y%m%d-%H%M%S).dump"
              docker compose "${compose_args[@]}" exec -T db \
                sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$backup"
              docker compose "${compose_args[@]}" exec -T db \
                pg_restore -l < "$backup" > /dev/null
            fi

            echo "Applying Alembic migrations..."
            if test -f .db-ops/client/database-url; then
              python3 ops/database.py migrate
            else
              docker compose "${compose_args[@]}" run --rm --no-deps api alembic upgrade head
            fi

            echo "Deploying $api_replicas FastAPI and $web_replicas Next.js containers..."
            if test -f .db-ops/client/database-url; then
              python3 ops/database.py deploy-api
            fi
            docker compose "${compose_args[@]}" up -d --no-deps --remove-orphans api web

            if test -f .db-ops/state/ha.json; then
              echo "Updating automatic database failover service..."
              python3 ops/database.py ha-install
            fi

            echo "Checking all API containers..."
            healthy=false
            for attempt in $(seq 1 12); do
              mapfile -t api_containers < <(
                docker compose "${compose_args[@]}" ps --status running -q api
              )
              if [ "${#api_containers[@]}" -eq "$api_replicas" ]; then
                healthy=true
                for container in "${api_containers[@]}"; do
                  if ! docker exec "$container" python -c \
                    "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"; then
                    healthy=false
                    break
                  fi
                done
                if [ "$healthy" = "true" ]; then
                  break
                fi
              fi
              echo "API containers not ready yet (attempt $attempt/12)"
              sleep 5
            done

            if [ "$healthy" != "true" ]; then
              echo "API health check failed"
              exit 1
            fi

            echo "Checking all Next.js containers..."
            web_healthy=false
            for attempt in $(seq 1 12); do
              mapfile -t web_containers < <(
                docker compose "${compose_args[@]}" ps --status running -q web
              )
              if [ "${#web_containers[@]}" -eq "$web_replicas" ]; then
                web_healthy=true
                for container in "${web_containers[@]}"; do
                  if ! docker exec "$container" node -e \
                    "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
                    web_healthy=false
                    break
                  fi
                done
                if [ "$web_healthy" = "true" ]; then
                  break
                fi
              fi
              echo "Next.js containers not ready yet (attempt $attempt/12)"
              sleep 5
            done

            if [ "$web_healthy" != "true" ]; then
              echo "Next.js health check failed"
              exit 1
            fi

            echo "Checking public HTTPS route..."
            public_healthy=false
            for attempt in $(seq 1 12); do
              if curl -fsS -o /dev/null https://aura.dev.crasnec.com; then
                public_healthy=true
                break
              fi
              echo "Public route not ready yet (attempt $attempt/12)"
              sleep 5
            done

            if [ "$public_healthy" != "true" ]; then
              echo "Public HTTPS health check failed"
              exit 1
            fi

            echo "AURA HA deployment completed"
          }
          deploy "$@" </dev/null

          REMOTE
