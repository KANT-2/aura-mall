name: AURA CD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify deployment SSH access
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Confirm deployment branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" != "develop" ]; then
            echo "Only develop can deploy"
            exit 1
          fi

      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Connect to Debian server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_HOST_PUBLIC_KEY: ${{ secrets.DEPLOY_HOST_PUBLIC_KEY }}
        run: |
          printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_HOST_PUBLIC_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "hostname && test -d '$DEPLOY_PATH' && echo 'SSH connection OK'"

      - name: Deploy AURA to Debian
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -se -- "$DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail

          cd "$1"

          echo "Checking deployment directory..."
          test -f compose.yaml
          test -f .env

          echo "Checking Git working tree..."
          test -z "$(git status --porcelain --untracked-files=no)"

          echo "Updating develop..."
          git fetch origin develop
          git switch develop
          git pull --ff-only origin develop

          echo "Validating Compose configuration..."
          docker compose config --quiet

                    echo "Checking AURA database..."
          docker compose up -d --no-deps db
          docker compose exec -T db sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'

          echo "Building API and Next.js..."
          docker compose build api web

          echo "Backing up AURA database..."
          mkdir -p "$HOME/workspace/aura-backups"
          chmod 700 "$HOME/workspace/aura-backups"
          backup="$HOME/workspace/aura-backups/aura-$(date +%Y%m%d-%H%M%S).dump"
          docker compose exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$backup"
          docker compose exec -T db pg_restore -l < "$backup" > /dev/null

          echo "Applying Alembic migrations..."
          docker compose run --rm --no-deps api alembic upgrade head

          echo "Deploying FastAPI and Next.js..."
          docker compose up -d --no-deps api web

          echo "Checking API..."
          healthy=false
          for attempt in $(seq 1 12); do
            if docker compose exec -T api python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"; then
              healthy=true
              break
            fi
            sleep 5
          done

          if [ "$healthy" != "true" ]; then
            echo "API health check failed"
            exit 1
          fi

          echo "Checking Next.js..."
          web_healthy=false
          for attempt in $(seq 1 12); do
            if curl -fsS -o /dev/null http://127.0.0.1:13000; then
              web_healthy=true
              break
            fi
            sleep 5
          done

          if [ "$web_healthy" != "true" ]; then
            echo "Next.js health check failed"
            exit 1
          fi

          echo "AURA API and Next.js deployment completed"

          REMOTE
          