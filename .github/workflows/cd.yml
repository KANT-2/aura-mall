name: AURA CD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify deployment SSH access
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Confirm deployment branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" != "develop" ]; then
            echo "Only develop can deploy"
            exit 1
          fi

      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Connect to Debian server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_HOST_PUBLIC_KEY: ${{ secrets.DEPLOY_HOST_PUBLIC_KEY }}
        run: |
          printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_HOST_PUBLIC_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "hostname && test -d '$DEPLOY_PATH' && echo 'SSH connection OK'"