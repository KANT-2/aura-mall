name: aura

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aura-internal

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      AURA_DATABASE_URL: ${AURA_DATABASE_URL:?Set AURA_DATABASE_URL in .env}
    expose:
      - "8000"
    networks:
      - aura-internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
      API_PREFIX: /api/v1
      API_SESSION_COOKIE: aura_session
    ports:
      - "127.0.0.1:13000:3000"
    networks:
      - aura-internal

volumes:
  postgres_data:

networks:
  aura-internal:
