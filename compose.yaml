name: aura

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aura-internal

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.payments
        required: false
    depends_on:
      db:
        condition: service_healthy
    environment:
      AURA_DATABASE_URL: ${AURA_DATABASE_URL:-}
      AURA_BFF_SHARED_KEY: ${AURA_BFF_SHARED_KEY:?Set AURA_BFF_SHARED_KEY in .env}
      AURA_JWT_ALGORITHM: HS256
      AURA_JWT_SIGNING_KEY: ${AURA_JWT_SIGNING_KEY:?Set AURA_JWT_SIGNING_KEY in .env}
      AURA_JWT_ISSUER: ${AURA_JWT_ISSUER:?Set AURA_JWT_ISSUER in .env}
      AURA_JWT_AUDIENCE: ${AURA_JWT_AUDIENCE:?Set AURA_JWT_AUDIENCE in .env}
    expose:
      - "8000"
    networks:
      aura-internal: {}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_TOSS_CLIENT_KEY: ${NEXT_PUBLIC_TOSS_CLIENT_KEY:-}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
      API_PREFIX: ${API_PREFIX:-/api/v1}
      API_ACCESS_COOKIE: ${API_ACCESS_COOKIE:-aura_access}
      API_REFRESH_COOKIE: ${API_REFRESH_COOKIE:-aura_refresh}
      API_ADMIN_ACCESS_COOKIE: ${API_ADMIN_ACCESS_COOKIE:-aura_admin_access}
      API_BFF_SHARED_KEY: ${AURA_BFF_SHARED_KEY:?Set AURA_BFF_SHARED_KEY in .env}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
    ports:
      - "127.0.0.1:13000:3000"
    networks:
      aura-internal: {}

volumes:
  postgres_data:

networks:
  aura-internal:
    ipam:
      config:
        - subnet: ${AURA_DOCKER_SUBNET:-10.250.50.0/24}
