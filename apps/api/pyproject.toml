[project]
name = "aura-api"
version = "0.1.0"
description = "AURA FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "pydantic-settings>=2.7,<3",
    "pyjwt>=2.15.1,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
