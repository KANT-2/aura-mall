# Local Unix socket is the administrative channel, restricted by Docker host access.
local all all trust
local replication all trust
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
hostnossl replication all 0.0.0.0/0 reject
hostnossl replication all ::/0 reject
hostssl replication aura_replicator 0.0.0.0/0 scram-sha-256
hostssl replication aura_replicator ::/0 scram-sha-256
hostssl all all 0.0.0.0/0 scram-sha-256
hostssl all all ::/0 scram-sha-256
