# Optional second Next.js instance; use after compose.lb.yaml.
services:
  web2:
    image: aura-web
    restart: unless-stopped
    environment:
      API_URL: ${AURA_API_PROXY_URL:-http://caddy:8080}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      API_ACCESS_COOKIE: ${API_ACCESS_COOKIE:-aura_access}
      API_REFRESH_COOKIE: ${API_REFRESH_COOKIE:-aura_refresh}
      API_ADMIN_ACCESS_COOKIE: ${API_ADMIN_ACCESS_COOKIE:-aura_admin_access}
      API_BFF_SHARED_KEY: ${AURA_BFF_SHARED_KEY:?Set AURA_BFF_SHARED_KEY in .env}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
    ports: !reset []
    expose:
      - "3000"
    networks:
      aura-internal: {}
      caddy:
        aliases:
          - aura-web
